<!DOCTYPE html>
<html lang="ko">
<head>
<meta http-equiv="content-type" content="text/html; charset=utf-8" />
<meta http-equiv="X-UA-Compatible" content="IE=edge" />
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>RealChart · Tooltip Webinar Playground</title>
<style>
	:root {
		--bg: #1a1c1e;
		--panel: #232527;
		--panel-2: #2b2e32;
		--border: #3c4044;
		--text: #e9eef0;
		--muted: #9aa4b0;
		--accent: #2eb8a2;
		--accent-soft: rgba(46, 184, 162, 0.16);
		--danger: #f87171;
		--side: 240px;
	}
	* { box-sizing: border-box; }
	html, body {
		margin: 0;
		height: 100%;
		background: var(--bg);
		color: var(--text);
		font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
	}
	.app {
		display: grid;
		grid-template-columns: var(--side) 1fr;
		height: 100%;
		min-height: 0;
	}
	.sidebar {
		border-right: 1px solid var(--border);
		background: var(--panel);
		display: flex;
		flex-direction: column;
		min-height: 0;
	}
	.sidebar-head {
		padding: 18px 16px 12px;
		border-bottom: 1px solid var(--border);
	}
	.sidebar-head h1 {
		margin: 0;
		font-size: 15px;
		font-weight: 700;
		letter-spacing: -0.01em;
	}
	.sidebar-head p {
		margin: 6px 0 0;
		font-size: 12px;
		color: var(--muted);
		line-height: 1.45;
	}
	#demo-list {
		overflow: auto;
		padding: 10px 8px 20px;
		flex: 1;
	}
	.demo-group { margin-bottom: 14px; }
	.demo-group-title {
		padding: 6px 10px 4px;
		font-size: 11px;
		font-weight: 700;
		letter-spacing: 0.06em;
		color: var(--muted);
		text-transform: uppercase;
	}
	.demo-item {
		display: block;
		width: 100%;
		text-align: left;
		border: 0;
		background: transparent;
		color: var(--text);
		padding: 9px 12px;
		border-radius: 8px;
		font-size: 13px;
		cursor: pointer;
	}
	.demo-item:hover { background: rgba(255,255,255,0.05); }
	.demo-item.is-active {
		background: var(--accent-soft);
		color: var(--accent);
		font-weight: 600;
	}
	.main {
		display: grid;
		grid-template-rows: auto 1fr;
		min-width: 0;
		min-height: 0;
	}
	.toolbar {
		display: flex;
		align-items: center;
		gap: 8px;
		padding: 10px 14px;
		border-bottom: 1px solid var(--border);
		background: var(--panel);
	}
	.toolbar button,
	.editor-toolbar button {
		border: 1px solid var(--border);
		background: var(--panel-2);
		color: var(--text);
		border-radius: 8px;
		padding: 7px 12px;
		font-size: 13px;
		cursor: pointer;
	}
	.toolbar button.primary {
		background: var(--accent);
		border-color: var(--accent);
		color: #102027;
		font-weight: 700;
	}
	.toolbar button:hover,
	.editor-toolbar button:hover { filter: brightness(1.08); }
	.hint {
		margin-left: 4px;
		font-size: 12px;
		color: var(--muted);
	}
	#status {
		margin-left: auto;
		font-size: 12px;
		color: var(--muted);
		max-width: 42%;
		overflow: hidden;
		text-overflow: ellipsis;
		white-space: nowrap;
	}
	#status.is-error { color: var(--danger); }
	.workspace {
		display: grid;
		grid-template-columns: minmax(240px, 1fr) 6px minmax(280px, 1fr);
		min-height: 0;
		min-width: 0;
	}
	.chart-wrap {
		min-height: 0;
		min-width: 0;
		padding: 12px;
		background: #1e2022;
	}
	#realchart {
		width: 100%;
		height: 100%;
		min-height: 0;
		border: 1px solid var(--border);
		border-radius: 10px;
		background: #232527;
		overflow: hidden;
	}
	.splitter {
		position: relative;
		background: var(--border);
		cursor: col-resize;
		user-select: none;
		touch-action: none;
	}
	.splitter::after {
		content: '';
		position: absolute;
		inset: 0 -3px;
	}
	.splitter:hover,
	body.is-resizing .splitter {
		background: var(--accent);
	}
	body.is-resizing {
		cursor: col-resize;
		user-select: none;
	}
	.editor-pane {
		display: grid;
		grid-template-rows: auto 1fr;
		min-height: 0;
		min-width: 0;
		background: var(--panel);
	}
	.editor-toolbar {
		display: flex;
		align-items: center;
		gap: 8px;
		padding: 8px 12px;
		border-bottom: 1px solid var(--border);
		background: var(--panel);
	}
	.editor-toolbar .label {
		font-size: 12px;
		color: var(--muted);
		margin-right: 2px;
	}
	.editor-toolbar button.icon {
		width: 32px;
		padding: 6px 0;
		font-weight: 700;
		line-height: 1;
	}
	#font-size {
		width: 120px;
		accent-color: var(--accent);
	}
	#font-size-value {
		min-width: 36px;
		font-size: 12px;
		color: var(--text);
		font-variant-numeric: tabular-nums;
	}
	#editor {
		min-height: 0;
		min-width: 0;
	}
</style>
<link href="./lib/realchart-style.css" rel="stylesheet">
<script type="text/javascript" src="./lib/realchart-lic.js"></script>
<script type="text/javascript" src="./lib/realchart.1.4.33.min.js"></script>
<script type="text/javascript" src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.39.0/min/vs/loader.min.js"></script>
<script type="text/javascript" src="./tooltip-webinar-playground.js"></script>
</head>
<body>
	<div class="app">
		<aside class="sidebar">
			<div class="sidebar-head">
				<h1>Tooltip Webinar</h1>
				<p>슬라이드 데모 순서와 동일합니다. config를 수정한 뒤 적용하세요.</p>
			</div>
			<div id="demo-list"></div>
		</aside>
		<section class="main">
			<div class="toolbar">
				<button type="button" class="primary" id="btn-apply">적용</button>
				<button type="button" id="btn-reload">원본 다시 불러오기</button>
				<span class="hint">⌘/Ctrl + S</span>
				<span id="status">준비 중…</span>
			</div>
			<div class="workspace" id="workspace">
				<div class="chart-wrap">
					<div id="realchart"></div>
				</div>
				<div class="splitter" id="splitter" title="드래그하여 너비 조절"></div>
				<div class="editor-pane">
					<div class="editor-toolbar">
						<span class="label">폰트</span>
						<button type="button" class="icon" id="font-dec" title="작게">A−</button>
						<input type="range" id="font-size" min="11" max="24" step="1" value="13" />
						<button type="button" class="icon" id="font-inc" title="크게">A+</button>
						<span id="font-size-value">13px</span>
					</div>
					<div id="editor"></div>
				</div>
			</div>
		</section>
	</div>
</body>
</html>
