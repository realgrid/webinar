<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="/pdfkit.js"></script>
    <title>두번째 데모 — 여러 페이지</title>
  </head>
  <body>
    <header class="demo-header">
      <a class="home-link" href="/">← 홈</a>
      <h1>두번째 데모 <span>여러 페이지</span></h1>
      <div class="page-toggles">
        <label><input type="checkbox" data-key="sale" checked /> 영업현황</label>
        <label><input type="checkbox" data-key="location" checked /> 지점별 판매실적</label>
      </div>
      <div class="view-tools">
        <button id="btn-zoom-out" type="button" title="축소">−</button>
        <button id="btn-zoom-in" type="button" title="확대">＋</button>
        <span class="divider"></span>
        <button id="btn-fit-width" type="button">너비맞춤</button>
        <button id="btn-fit-height" type="button">높이맞춤</button>
        <button id="btn-fit-page" type="button">화면맞춤</button>
      </div>
      <div class="toolbar">
        <button id="btn-print" type="button">출력</button>
        <button id="btn-pdf" type="button">PDF 출력</button>
        <button id="btn-image" type="button">이미지(PNG)</button>
      </div>
    </header>
    <div id="viewer"></div>
    <script type="module" src="/src/demo-2.ts"></script>
  </body>
</html>
