<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RealReport 이벤트 활용하기</title>
    <style>
      :root {
        font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif;
        color-scheme: light dark;
        color: #213547;
        background-color: #f6f7f9;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }

      main {
        width: 100%;
        max-width: 560px;
      }

      .eyebrow {
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #7c3aed;
        margin: 0 0 8px;
      }

      h1 {
        font-size: 28px;
        line-height: 1.3;
        margin: 0 0 6px;
      }

      .desc {
        margin: 0 0 32px;
        color: #6b7280;
        font-size: 15px;
        line-height: 1.6;
      }

      .demo-list {
        display: flex;
        flex-direction: column;
        gap: 12px;
        list-style: none;
        margin: 0;
        padding: 0;
      }

      .demo-list a {
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 20px 24px;
        border-radius: 14px;
        background: #ffffff;
        border: 1px solid #e5e7eb;
        text-decoration: none;
        color: inherit;
        transition: border-color 0.15s, box-shadow 0.15s, transform 0.15s;
      }

      .demo-list a:hover {
        border-color: #7c3aed;
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.07);
        transform: translateY(-2px);
      }

      .num {
        flex: none;
        width: 40px;
        height: 40px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 10px;
        background: #f1eafd;
        color: #7c3aed;
        font-weight: 700;
        font-size: 17px;
      }

      .demo-title {
        font-weight: 600;
        font-size: 16px;
        margin: 0 0 2px;
      }

      .demo-sub {
        margin: 0;
        font-size: 13.5px;
        color: #6b7280;
      }

      .arrow {
        margin-left: auto;
        color: #9ca3af;
        font-size: 18px;
        transition: transform 0.15s, color 0.15s;
      }

      .demo-list a:hover .arrow {
        transform: translateX(3px);
        color: #7c3aed;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          color: rgba(255, 255, 255, 0.87);
          background-color: #1b1d21;
        }

        .demo-list a {
          background: #24262b;
          border-color: #33363d;
        }

        .num {
          background: rgba(139, 92, 246, 0.18);
        }

        .desc,
        .demo-sub {
          color: #9ca3af;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">RealReport Webinar</p>
      <h1>이벤트 활용하기</h1>
      <p class="desc">
        RealReport 이벤트를 활용하여 동적으로 리포트의 내용, 스타일, 표시여부
        등을 변경하는 방법을 소개합니다.
      </p>
      <ul class="demo-list">
        <li>
          <a href="/demo-1.html">
            <span class="num">1</span>
            <span>
              <p class="demo-title">첫번째 데모</p>
              <p class="demo-sub">제품별 목록</p>
            </span>
            <span class="arrow">→</span>
          </a>
        </li>
        <li>
          <a href="/demo-2.html">
            <span class="num">2</span>
            <span>
              <p class="demo-title">두번째 데모</p>
              <p class="demo-sub">여러 페이지</p>
            </span>
            <span class="arrow">→</span>
          </a>
        </li>
      </ul>
    </main>
  </body>
</html>
