<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
    <title>seminar-2026-11</title>

  <body>
    <main class="card">
      <header class="card-header">
        <span class="eyebrow">RealMap · Drilldown</span>
        <h1>대한민국 인구밀도 드릴다운</h1>
        <p>시도 &gt; 시군구 · 시도를 클릭하면 그 시도의 시군구만 보입니다</p>

      <!-- 리얼맵 컨테이너 -->
      <div id="realmap"></div>

      <footer class="card-footer">
        <button id="drillup" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6" /></svg>
          시도로 돌아가기
        </button>
        <span class="hint">시군구를 클릭하면 인구밀도를 비교합니다 · 버튼이나 <kbd>Esc</kbd>를 누르면 시도로 돌아갑니다</span>
      </footer>
    </main>

    <!-- 리얼맵 생성 스크립트 로드 -->
    <script type="module" src="/src/start.ts"></script>
